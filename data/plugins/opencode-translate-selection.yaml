name: Opencode Translate Selection
repo: https://github.com/Realmagnum/opencode-translate-selection
tagline: Instant inline translation tooltip on text selection with Smart Hybrid LLM/MT
description: Floating translation tooltip positioned directly above the native Quote toolbar for OpenCode Desktop (v2.2.0+). Supports all languages (130+ via Google MT & active session LLM). Smart Hybrid Routing; instant Google Translate (~100ms) for simple phrases, and session LLM outside chat history for structured lists and code. Features Token Shielding, GUI Settings with Live Preview, 5 presets, and Markdown copy.
